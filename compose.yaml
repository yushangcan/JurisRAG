services:
  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      RETRIEVAL_MODE: lexical
      INDEX_DIR: /app/data/index/legal_knowledge
    volumes:
      - ./data/index:/app/data/index
    ports:
      - "8000:8000"
    healthcheck:
      # /live 只检查进程；依赖完整度由 /ready 单独展示，避免依赖短暂异常反复重启。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
