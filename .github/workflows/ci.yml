name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENABLE_LLM: "false"
      EMBEDDING_BACKEND: hash
      RERANKER_BACKEND: none
      INDEX_DIR: tmp/ci-index
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify repository safety boundary
        shell: bash
        run: |
          forbidden="$(git ls-files '.env' 'data/index/**' 'data/models/**' 'tmp/**' 'logs/**')"
          if [ -n "$forbidden" ]; then
            echo "Generated data or secrets are tracked:"
            echo "$forbidden"
            exit 1
          fi

      - name: Build lightweight test index
        run: python -m offline_ingestion.build_index

      - name: Run test suite
        run: python -m pytest -q
